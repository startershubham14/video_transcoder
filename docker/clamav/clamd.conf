# clamd config for the pipeline. Key change vs the image default: raise the scan limits to
# the pipeline's max input (~2 GiB, MAX_SIZE_BYTES) so large uploads can be streamed to clamd
# for scanning instead of clamd closing the socket at the 25 MB default (Broken pipe).
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
Foreground yes

# The app connects over TCP; keep the local socket for the image healthcheck (clamdcheck.sh).
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock

MaxThreads 8
StreamMaxLength 2048M
MaxScanSize 2048M
MaxFileSize 2048M
